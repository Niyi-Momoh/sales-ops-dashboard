[project]
name = "sales-ops-dashboard"
version = "0.1.0"
description = "A Shiny for Python dashboard for sales and operations teams."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Oluwaniyi Victor Momoh" }]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
